<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전체 화면 한눈에 보기</title>
<!-- 캔버스 템플릿(정적). build_canvas.py 가 아래 hd-data 에 데이터만 끼워 넣는다. 외부 라이브러리 없음. -->
<link id="tokens" rel="stylesheet" href="tokens.css" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;background:#ECECE8;color:#1c1c1c;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* ---------- 헤더: 제목 · 탭 · 팔레트 · 보기 (조작 그룹 3개) ---------- */
.hd{flex:none;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid #dcdcd7;position:relative;z-index:5}
.hd h1{font-size:17px;font-weight:700;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tabs{display:flex;gap:2px;background:#EFEFEB;border-radius:12px;padding:3px}
.tab{min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;color:#5a5a55;cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:#1c1c1c;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pal{display:flex;align-items:center;gap:2px;margin-left:auto}
.pal-label{font-size:13px;color:#777;margin-right:4px}
.dot{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:999px;background:transparent;font-size:14px;color:#444;cursor:pointer}
.dot i{flex:none;width:22px;height:22px;border-radius:999px;background:var(--dot);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot[aria-pressed="true"]{background:#F1F1ED;color:#1c1c1c;font-weight:700}
.dot[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 4px #1c1c1c}
.dot:hover{background:#F5F5F2}
.view{display:flex;align-items:center;gap:4px}
.vbtn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #dcdcd7;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.vbtn:hover{background:#F5F5F2}
.zoom{min-width:64px;font-variant-numeric:tabular-nums;color:#555}
body:not([data-tab="screens"]) .view,body.modal-open .view{visibility:hidden}
@media (max-width:760px){
  .hd{padding:6px 10px;gap:4px 8px}
  .hd h1{flex:1 1 0;font-size:16px;order:1;max-width:none}
  .pal{order:2;margin-left:0}
  .tabs{order:3}
  .view{order:4;margin-left:auto}
  .tab{padding:0 7px;font-size:13px}
  .fit-long{display:none}
  .zoom{min-width:52px}
  .dot{padding:0}
  .dot{justify-content:center}
  .dot b,.pal-label{display:none}
  .vbtn{padding:0 10px}
}

/* ---------- 판 ---------- */
.panes{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none}
.pane iframe.doc{width:100%;height:100%;border:0;display:block;background:#F6F6F3}
#screens{overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#screens.dragging{cursor:grabbing}
#screens.dragging .cover{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;will-change:transform}

/* 판 안의 글 — 첫 배율 0.72 기준으로 읽히게 크게 쓴다(22px → 약 16px) */
.intro{padding:48px 0 0;max-width:1760px}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
.hint{font-size:20px;color:#6b6b66;margin:0 0 18px}
.story h2{font-size:42px;line-height:1.3;margin:0 0 14px}
.story h2 em{font-style:normal;color:var(--c-brand,#2563eb)}
.story .sum{font-size:22px;line-height:1.6;color:#444;margin:0 0 24px}
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.idea{background:#fff;border-radius:20px;padding:22px}
.idea b{font-size:22px}
.idea p{font-size:19px;line-height:1.55;color:#555;margin:8px 0 0}
.people{margin-top:20px}
.people h3{font-size:22px;margin:0 0 10px}
.people ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.people li{background:#fff;border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.45;color:#555}
.people li b{display:block;font-size:18px;color:#1c1c1c;margin-bottom:2px}
.people li .win{display:block;color:#1c1c1c;margin-top:4px}
.decisions{margin-top:6px}
.narrow .ideas,.narrow .decisions ul,.narrow .people ul,.narrow .intro-grid{grid-template-columns:1fr}
.narrow .decisions{margin-top:0}
.narrow .story h2{font-size:38px}
.decisions h3{font-size:27px;margin:0 0 8px}
.decisions .core{font-size:21px;color:#333;margin:0 0 14px}
.decisions ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.decisions li{background:#fff;border-radius:16px;padding:14px 18px;font-size:19px;line-height:1.45}
.decisions li b{margin-right:4px}
.decisions .why{display:block;color:#666;font-size:18px}
.v{display:inline-block;font-size:15px;font-weight:700;border-radius:8px;padding:2px 9px;margin-right:8px;background:#eee;color:#444;vertical-align:2px}
.v-cut{background:#fde8e8;color:#9b1c1c}
.v-lighten{background:#e7f0ff;color:#1d4ed8}
.v-follow{background:#e6f6ec;color:#166534}
.decisions h3.mk{margin-top:18px}

.rows{position:relative;padding-bottom:40px}
.flow{padding-top:90px}
.glabel{font-size:31px;font-weight:700;margin:0 0 104px;white-space:nowrap}
.cards{display:flex;gap:84px;align-items:flex-start}
.card{flex:none;width:var(--card-w,375px);position:relative}
.phone{position:relative;width:var(--card-w,375px);height:var(--card-h,812px);border-radius:var(--card-r,28px);overflow:hidden;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.10)}
.card.xp{z-index:6}
.card.xp>:not(.phone):not(.anno){visibility:hidden}
.phone iframe{display:block;width:var(--card-w,375px);height:var(--card-h,812px);border:0;pointer-events:none;background:#fff}
.cover{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;margin:0;background:transparent;border-radius:var(--card-r,28px);cursor:pointer}
.cover:hover,.cover:focus-visible{outline:4px solid #2563eb;outline-offset:0}
.ftitle{font-size:22px;font-weight:700;margin-top:16px;line-height:1.35}
.state{display:inline-block;font-size:15px;font-weight:700;color:#8a5a00;background:#fff3cf;border-radius:8px;padding:2px 8px;margin-right:8px;vertical-align:2px}
.fdesc{font-size:18px;color:#555;margin-top:4px;line-height:1.45}
.pol{margin:8px 0 0;padding-left:22px;font-size:17px;line-height:1.5;color:#444}
.more{font-size:17px;color:#666;margin-top:4px}
.more summary,.foot summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.more .pol{margin-top:0}
svg.ar{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
/* 주요 흐름(screens.json 갈래) = 회색 점선 */
svg.ar path.ln{fill:none;stroke:#9AA09A;stroke-width:calc(var(--lw,2) * .8);stroke-dasharray:calc(var(--lw,2) * 3) calc(var(--lw,2) * 2.5);stroke-linecap:butt;stroke-linejoin:round;marker-end:url(#hd-head)}
svg.ar marker path,svg.ar marker circle{fill:#9AA09A}
/* 갈래 이름표: 평소엔 숨김(선만). 연결 보기에서 화면 안 링크 답이 없을 때만 출발 카드 오른쪽에 */
.alabel{position:absolute;display:none;background:#fff;border:2px solid #8a8d86;color:#4a4c47;font-size:17px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.10)}
.foot{padding:20px 0 120px;font-size:17px;color:#777;max-width:1500px}
.foot p{margin:0 0 6px}
.foot ul{margin:4px 0 0;padding-left:22px;line-height:1.6}
.foot a{color:#555}

/* ---------- 크게 보기 ---------- */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,20,20,.62);display:flex;flex-direction:column;align-items:center;justify-content:center}
#modal[hidden]{display:none}
#modal .box{position:relative;border-radius:var(--modal-r,30px);overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal iframe{display:block;width:var(--modal-w,390px);height:var(--modal-h,844px);border:0;transform-origin:0 0;background:#fff}
#modal .close{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;min-width:44px;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;z-index:2}
#modal .mpick{flex:none;margin:48px 0 12px;min-width:44px;min-height:44px;padding:0 26px;border:2px solid #fff;border-radius:999px;background:var(--c-brand,#2563eb);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#modal .mpick:hover{filter:brightness(1.08)}
#modal .mpick[aria-pressed="true"]{background:#fff;color:var(--c-brand-text,#1d4ed8);border-color:var(--c-brand,#2563eb)}

/* ---------- 연결 보기: 화살표 켜고 끄기 · Shift+클릭 강조 ---------- */
.vbtn[aria-pressed="false"]{color:#999;text-decoration:line-through}
#rows.noarrows path.ln,#rows.noarrows .alabel{display:none}
#rows.focusing .card{opacity:.22}
#rows.focusing .card.hl{opacity:1}
#rows.focusing .card.hl .phone{box-shadow:0 0 0 6px #8a8d86,0 3px 14px rgba(0,0,0,.10)}
#rows.focusing .card.focus .phone{box-shadow:0 0 0 10px #1c1c1c,0 3px 14px rgba(0,0,0,.10)}
#rows.focusing path.ln{opacity:.18}
#rows.focusing path.ln.on{opacity:1;stroke:#7d827d;display:inline}
#rows.focusing path.ln.rep{display:none}
#rows.focusing:not(.haslk):not(.lkwait) .alabel.on{display:block}
#rows.focusing .card.lt .phone{box-shadow:0 0 0 8px var(--ring),0 3px 14px rgba(0,0,0,.10)}
#rows.focusing .card.lt.em .phone{box-shadow:0 0 0 14px var(--ring),0 3px 14px rgba(0,0,0,.10)}
#rows.focusing .card.lt.dim{opacity:.3}
/* 색 링크 층: 선은 카드 아래(출발점은 화면 안 버튼 색칠이 보여 준다) · 선 위 태그는 카드 위 */
svg.lks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:-1}
svg.lks path.lk{fill:none;stroke-width:var(--lkw,2.5px);stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:default}
svg.lks path.lk.bk{opacity:.45}   /* 앞 화면으로 가는 연결: 같은 색·같은 굵기(굵기 설정은 모든 선에 같게), 흐리게만 */
svg.lks path.lk.em{stroke-width:calc(var(--lkw,2.5px) + 2px);opacity:1}
svg.lks path.lk.dim{opacity:.15}
#lkl{position:absolute;left:0;top:0;width:0;height:0;z-index:8}
.ltag{position:absolute;left:0;top:0;visibility:hidden;transform:translate(-50%,-50%) scale(var(--ts,1));background:#fff;border:2px solid currentColor;border-radius:999px;padding:2px 12px;font-size:16px;line-height:1.35;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:default}
/* --ts: 작게 볼 때(배율 < 1) 태그를 화면에서 글자 12px · 테두리 1.5px 이상으로(가운데 고정) */
.ltag.on{visibility:visible}
.ltag.float.em,.ltag.editing{visibility:visible}   /* 틈 칸도 없는 태그: 마우스 올릴 때만(범례엔 늘) */
.ltag.gap{overflow:hidden;text-overflow:ellipsis}   /* 곧은 선의 태그: 카드 사이 틈 폭에 맞게 말줄임 */
.ltag.gap.em,.ltag.gap.editing{max-width:none!important;overflow:visible;z-index:9}   /* 마우스 올리면 전체 글자, 맨 위(틈 밖으로 넘쳐도 됨) */
.ltag-in{font:inherit;color:#1c1c1c;border:0;outline:0;background:none;padding:0;text-align:center;min-width:4em}
.ltag.em{box-shadow:0 0 0 3px currentColor}
.ltag.dim{opacity:.15}
.lnum{position:absolute;left:10px;top:10px;z-index:1;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:var(--ring);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.nbadge{position:absolute;top:56px;right:10px;z-index:1;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:#e5484d;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
/* 범례(연결 보기 중에만): 쌍마다 켜고 끄기 · 색 · 굵기 */
#legend{position:absolute;right:12px;bottom:10px;z-index:4;width:360px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:12px 14px;font-size:13px;cursor:default;touch-action:auto;-webkit-user-select:none;user-select:none}
#legend[hidden],body.modal-open #legend{display:none}
#legend .lgt{margin:0 0 8px;font-size:13px;font-weight:700;color:#1c1c1c}
#legend .lgrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer}
#legend .lgrow:hover,#legend .lgrow.em{background:#F4F5F3}
#legend .lgrow.dim{opacity:.45}
#legend .lgall{font-weight:600}
#legend .lgdot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0}
#legend .lgtx{flex:1;line-height:1.35;color:#333}
#legend .lgtx i{font-style:normal;color:#777}
#legend input[type=checkbox]{accent-color:#444;width:16px;height:16px}
#legend .lgstyle{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;margin-top:8px;padding-top:8px;color:#777}
#legend .lgddw{display:flex;align-items:center;gap:6px}
#legend .lgddb{display:flex;align-items:center;gap:6px;border:1.5px solid #e2e2de;border-radius:8px;background:#fff;padding:4px 8px;cursor:pointer;font-size:12px;color:#1c1c1c;white-space:nowrap}
.sw{display:inline-flex;gap:2px}.sw i{width:9px;height:9px;border-radius:50%}
#legend .lgw{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
#legend .lgw input{flex:1;min-width:0}
#legend .lgw b{font-size:12px;color:#444;min-width:40px;font-variant-numeric:tabular-nums}
.lgdd{position:fixed;z-index:30;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:5px;width:214px;font-size:12px}
.lgdd[hidden],.lgsw[hidden]{display:none}
.lgdd button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px;font-weight:600;text-align:left}
.lgdd button:hover{background:#F4F5F3}.lgdd button.on{background:#EEF0EE}
.lgdd hr{border:0;border-top:1px solid #eee;margin:4px 2px}.lgdd .mut{color:#777;font-weight:500}
.lgsw{position:fixed;z-index:31;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px;width:190px}
.lgsw .g{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lgsw .g button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer;padding:0}
.lgsw .x{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:11px;color:#777}
.lgsw input[type=color]{width:34px;height:22px;border:0;padding:0;background:none}
/* 전환 메뉴(T): 캔버스 전환마다 이름 · 쓰는 곳 · 시간/곡선 토큰 · ▶ 보기 · 애니메이션 끄기 */
#tmenu{position:fixed;z-index:26;right:12px;top:64px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);padding:10px 12px;font-size:13px}
#tmenu[hidden]{display:none}
#tmenu h2{font-size:14px;margin:2px 4px 6px}
#tmenu .trow{display:grid;grid-template-columns:1fr auto;gap:1px 12px;align-items:center;padding:7px 4px;border-top:1px solid #f0f0ec}
#tmenu .tn{font-weight:700}
#tmenu .tw{color:#777;font-size:12px}
#tmenu .tv{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#555}
#tmenu .tplay{grid-column:2;grid-row:1 / span 3;min-height:36px;padding:0 12px;border:1px solid #dcdcd7;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#tmenu .tplay:hover{background:#F5F5F2}
#tmenu .toff{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;padding:9px 4px 2px;cursor:pointer}
#legend .lgflow{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;margin-top:8px;padding-top:8px;color:#555;cursor:pointer}

/* 카드 위 주석 버튼: 화면 밖(카드 오른쪽 위), 캔버스 조작 모양 · 단축키 안내 */
.anno{position:absolute;bottom:calc(100% + 8px);right:0;z-index:2;min-width:44px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:#2b2b29;color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none}
.anno::before{content:"\270E\00a0";font-weight:400}
.anno::after{content:'';position:absolute;left:0;right:0;top:100%;height:10px}
.card:hover .anno,.anno:focus-visible{display:block}
#khint{position:absolute;left:12px;bottom:10px;z-index:3;pointer-events:none;font-size:13px;color:#6b6b66;background:rgba(255,255,255,.82);border-radius:8px;padding:5px 10px;white-space:nowrap}
body.modal-open #khint{display:none}
/* 도구 막대(왼쪽): 손 = 기본(끌면 화면 이동) · 이동 = 카드를 끌어 옮기기. 단계마다 도구가 늘어난다 */
#tools{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;padding:6px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:default}
body.modal-open #tools{display:none}
#tools hr{width:24px;border:0;border-top:1px solid #e6e6e2;margin:2px auto}
#tools .tb{width:36px;height:36px;border:0;border-radius:9px;background:none;color:#444;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#tools .tb:hover{background:#F1F1EE}
#tools .tb[aria-pressed="true"]{background:#1c1c1c;color:#fff}
#tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ttip{position:fixed;z-index:41;background:#1c1c1c;color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;pointer-events:none;white-space:nowrap}
#ttip[hidden]{display:none}
#ttip kbd{font:600 11px system-ui,sans-serif;background:#444;border-radius:4px;padding:1px 5px;margin-left:8px}
#ttip span{display:block;color:#bbb;font-size:11.5px;margin-top:1px}
#screens.t-move .cover{cursor:move}
#screens.t-trigger .cover,#screens.t-knife .cover,#screens.t-knife,#screens.t-pick .cover{cursor:crosshair}
.sock{display:none;position:absolute;z-index:4;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);cursor:crosshair;pointer-events:auto}
#screens.t-trigger .sock,.sock.lit{display:block}
.sock:hover{transform:scale(1.35)}
#ghost{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}

    if (d.add && draft && !editing && !pop.hidden) {   // Shift+클릭: 고른 묶음에 더하거나 빼기
      var note = $('#pnote').value, intent = curIntent(), at = -1;
      draft.targets.forEach(function (t, i) { if (t.path === it.path) at = i; });
      if (at >= 0) draft.targets.splice(at, 1); else draft.targets.push(it);
      if (!draft.targets.length) { hidePop(); return; }
      drawPins(); showPop(popItem(draft, it), note, intent);
      return;
    }
    editing = null;
    draft = {screen: String(d.screen || mscreen || ''), targets: [it]};
    drawPins(); showPop(popItem(draft, it), '', 'change');
  }
});
function drawPins() {
  var layer = $('#mpins'), h = '';
  if (mscreen && !modal.hidden) notes.forEach(function (n, i) {
    if (n.screen !== mscreen) return;
    tgts(n).forEach(function (t) {
      var r = t.rect, s = mscale; if (!r) return;
      h += '<div class="pin-box" style="left:' + (r.x * s) + 'px;top:' + (r.y * s) + 'px;width:' + (r.w * s) + 'px;height:' + (r.h * s) + 'px"></div>' +
        '<div class="pin" data-n="' + (i + 1) + '" style="left:' + (r.x * s) + 'px;top:' + (r.y * s) + 'px">' + circled(i + 1) + '</div>';
    });
  });
  if (draft && !modal.hidden) draft.targets.forEach(function (t, i) {   // 지금 고른 요소들: 테두리 + 고른 순서
    var r = t.rect, s = mscale; if (!r) return;
    h += '<div class="sel-box" style="left:' + (r.x * s) + 'px;top:' + (r.y * s) + 'px;width:' + (r.w * s) + 'px;height:' + (r.h * s) + 'px"><b>' + (i + 1) + '</b></div>';
  });
  layer.innerHTML = h;
}
function renderNotes() {
  notesEl.hidden = !notes.length;
  $('#ncount').textContent = notes.length ? notes.length + '건' : '';
  $('#nlist').innerHTML = notes.map(function (n, i) {
    return '<li data-id="' + esc(n.id) + '"' + (n.sent ? ' class="sent"' : '') + '><div><span class="nn">' + circled(i + 1) + '</span><span class="ns">' + esc(n.screen) +
      ' · ' + esc(n.intent) + (tgts(n).length > 1 ? ' · ' + tgts(n).length + '개 요소' : '') + (n.sent ? ' · 보냄' : '') + '</span></div><div class="nt">"' + esc(n.text) + '"</div><div class="nnote">' + esc(n.note) + '</div>' +
      '<div class="nact"><button class="nbtn" data-act="edit">고치기</button><button class="nbtn" data-act="del">지우기</button></div></li>';
  }).join('');
  $('#nclear').hidden = !notes.some(function (n) { return n.sent; });
  var cnt = {};
  notes.forEach(function (n) { cnt[n.screen] = (cnt[n.screen] || 0) + 1; });
  $$('.card', rowsEl).forEach(function (c) {
    var b = $('.nbadge', c), k = cnt[c.dataset.id] || 0;
    if (!k) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('span'); b.className = 'nbadge'; $('.phone', c).appendChild(b); }
    b.textContent = k; b.title = '메모 ' + k + '건';
  });
  var pc = {};                                     // 반영 대기 = 화면 파일을 바꾸는 편집 메모(보냈어도 '보낸 것 지우기' 전까지)
  notes.forEach(function (n) { if (n.edit) pc[n.screen] = (pc[n.screen] || 0) + 1; });
  $$('.card', rowsEl).forEach(function (c) {
    var b = $('.pchip', c), k = pc[c.dataset.id] || 0;
    if (!k) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('span'); b.className = 'pchip'; $('.phone', c).appendChild(b); }
    b.textContent = '반영 대기 ' + k;
  });
  if (typeof paintCardText === 'function' && ORIG) { paintCardText(); sendAllPending(); }
  if (VL && VL.refresh) VL.refresh();
}
$('#nlist').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-act]'); if (!b) return;
  var id = b.closest('li').dataset.id, n = notes.filter(function (x) { return x.id === id; })[0]; if (!n) return;
  if (b.dataset.act === 'del') { notes = notes.filter(function (x) { return x.id !== id; }); if (editing === id) hidePop(); saveNotes(); return; }
  editing = id; draft = null;
  var ts = tgts(n);
  showPop({text: ts.length > 1 ? ts.length + '개 요소 · ' + (ts[0].text || '') : ts[0].text, path: ts.map(function (t) { return t.path; }).join('\n'),
           rect: n.screen === mscreen ? ts[0].rect : null}, n.note, n.intent);
});
function requestText(notesList) {
  var list = [];                                   // 여러 요소 메모는 요소마다 한 항목으로 펼친다(형식은 그대로)
  notesList.forEach(function (n) { tgts(n).forEach(function (t) { list.push({screen: n.screen, path: t.path, text: t.text, intent: n.intent, note: n.note}); }); });
  return '[hyper-design 수정 요청] out=' + outDir() + ' · ' + list.length + '건\n' + list.map(function (n, i) {
    return (i + 1) + '. screen=' + n.screen + ' · path=' + n.path + '\n   text="' + String(n.text).replace(/\s+/g, ' ') + '" · intent=' + n.intent +
      '\n   요청: ' + String(n.note).replace(/\s*\n\s*/g, ' ');
  }).join('\n');
}
function copyText(t) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function copySend(list, msg) {
  var t = requestText(list);
  window.__hdLastSend = t;
  copyText(t);
  list.forEach(function (n) { n.sent = true; });
  saveNotes();
  $('#nmsg').textContent = msg || '복사했어요 — 터미널에 붙여넣으세요';
}
// 로컬 도우미(helper.py, 7단계): http 로 열렸고 토큰이 있을 때만. 바로 쓰는 편집 → /api/apply, 나머지 → /api/forward(Paseo 또는 대기열 파일)
var HELPER = !!window.__hdHelper && /^https?:$/.test(location.protocol), HTOKEN = new URLSearchParams(location.search).get('hd') || '';
function helperPost(url, body) {
  return fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-HD-Token': HTOKEN}, body: JSON.stringify(body)})
    .then(function (r) { if (!r.ok) throw new Error('helper ' + r.status); return r.json(); });
}
function directOf(n) {                               // 도우미가 화면 파일에 바로 쓸 수 있는 편집
  return n.edit === 'text' || n.edit === 'title' || n.edit === 'purpose' ||
         (n.edit === 'link' && ((n.op === 'link' && !!n.to) || n.op === 'cut' || n.op === 'untrigger'));
}
$('#nsend').addEventListener('click', function () {
  var list = notes.filter(function (n) { return !n.sent; });
  if (!list.length) list = notes.slice();
  if (!list.length) return;
  if (!HELPER || !HTOKEN) { copySend(list); return; }
  var direct = list.filter(directOf), rest = list.filter(function (n) { return !directOf(n); });
  $('#nmsg').textContent = '도우미에게 보내는 중…';
  helperPost('/api/apply', {edits: direct.map(function (n) { return {id: n.id, screen: n.screen, edit: n.edit, op: n.op, to: n.to, path: n.path, value: n.value}; })})
    .then(function (res) {
      var ok = {}; (res.applied || []).forEach(function (id) { ok[id] = 1; });
      var done = direct.filter(function (n) { return ok[n.id]; }), left = rest.concat(direct.filter(function (n) { return !ok[n.id]; }));   // 못 쓴 편집도 요청문으로
      var after = function (fw) {
        if (done.length) logEdit('바로 반영', done);
        notes = notes.filter(function (n) { return !ok[n.id]; });
        left.forEach(function (n) { n.sent = true; });
        saveNotes();
        window.__hdLastHelper = {apply: res, forward: fw};
        $('#nmsg').textContent = (done.length ? '바로 반영 ' + done.length + '건' : '') + (done.length && left.length ? ' · ' : '') +
          (left.length ? '터미널로 ' + left.length + '건(' + (fw && fw.via === 'paseo' ? 'Paseo' : '대기열 파일') + ')' : '');
        if (done.length) setTimeout(function () { location.reload(); }, 700);   // 다시 빌드된 캔버스로
      };
      if (!left.length) { after(null); return; }
      var t = requestText(left); window.__hdLastSend = t;
      return helperPost('/api/forward', {text: t}).then(after);
    })
    .catch(function () { copySend(list, '도우미가 꺼져 있어 복사했어요 — 터미널에 붙여넣으세요'); });
});
// 메모 목록 접기 · 펴기 — 상태는 prefs 가 아닌 별도 키(prefs.normalize 가 모르는 필드를 버린다)
var NUI = 'hd-notes-ui';
function setNotesOpen(open, save) {
  notesEl.classList.toggle('collapsed', !open);
  $('#ntoggle').setAttribute('aria-expanded', String(open));
  if (save) { try { localStorage.setItem(NUI, open ? 'open' : 'closed'); } catch (e) {} }
}
(function () { var open = true; try { open = localStorage.getItem(NUI) !== 'closed'; } catch (e) {} setNotesOpen(open, false); })();
$('#ntoggle').addEventListener('click', function () { setNotesOpen(notesEl.classList.contains('collapsed'), true); });
$('#nclear').addEventListener('click', function () {
  notes = notes.filter(function (n) { return !n.sent; });
  $('#nmsg').textContent = '';
  saveNotes();
});
addEventListener('keydown', function (e) {
  if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  var k = (e.key || '').toLowerCase();
  if (k === 'a' && modal.hidden) { e.preventDefault(); setArrows(!arrowsOn); }
  else if (k === '0' && modal.hidden && document.body.dataset.tab === 'screens') { e.preventDefault(); fit(); }
  else if (k === 'p' && !modal.hidden) { e.preventDefault(); setPick(!picking); }
  else if (k && 'vhlc'.indexOf(k) >= 0 && modal.hidden && document.body.dataset.tab === 'screens') { e.preventDefault(); setTool({v: 'move', h: 'hand', l: 'trigger', c: 'knife'}[k]); }
});
renderNotes();

/* ---------- 시작 ---------- */
(function () {                                    // 판 위 글은 첫 배율에서 화면 폭에 들어오게
  var pw = pane.clientWidth, narrow = pw < 600;
  if (narrow) stage.classList.add('narrow');
  var left = narrow ? 12 : 24 + LEFT * Z0;
  var mw = Math.round((pw - left - 24) / Z0) + 'px';
  $('#intro').style.maxWidth = mw; $('#foot').style.maxWidth = mw;
})();
loadCardPos();
drawArrows();
home();
loadVisible();
var hashTab = (location.hash || '').slice(1);
if (hashTab === 'foundation' || hashTab === 'components') showTab(hashTab);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawArrows(); });
if (window.ResizeObserver) {                       // 글꼴·토큰이 늦게 와서 줄 높이가 바뀌면 화살표를 다시
  var roRaf = 0, roH = 0;
  new ResizeObserver(function () {
    if (rowsEl.offsetHeight === roH) return; roH = rowsEl.offsetHeight;
    cancelAnimationFrame(roRaf); roRaf = requestAnimationFrame(drawArrows);
  }).observe(rowsEl);
}
window.__hdReady = performance.now();
})();
</script>
